name: Python CI

on:
  push:
    branches:
      - main
      - feature/ci-demo

  pull_request:
    branches:
      - main

jobs:

  detect-stack:
    name: Detect Stack
    runs-on: ubuntu-latest

    outputs:
      is_python: ${{ steps.detect.outputs.is_python }}
      has_dockerfile: ${{ steps.detect.outputs.has_dockerfile }}
      branch: ${{ steps.detect.outputs.branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect project stack
        id: detect
        run: |
          IS_PYTHON=false
          HAS_DOCKERFILE=false
          BRANCH="${GITHUB_REF_NAME}"

          if [ -f "requirements.txt" ] || \
             [ -f "pyproject.toml" ] || \
             [ -f "setup.py" ]; then
            IS_PYTHON=true
          fi

          if [ -f "Dockerfile" ]; then
            HAS_DOCKERFILE=true
          fi

          echo "is_python=${IS_PYTHON}" >> "$GITHUB_OUTPUT"
          echo "has_dockerfile=${HAS_DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          echo "=============================="
          echo "Stack Detection"
          echo "=============================="
          echo "Python:       ${IS_PYTHON}"
          echo "Dockerfile:   ${HAS_DOCKERFILE}"
          echo "Branch:       ${BRANCH}"
          echo "=============================="

  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    needs: detect-stack

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application tests
        run: |
          python app.py --test

      - name: Build Docker image
        run: |
          docker build -t ci-demo-app .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ci-demo-app:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ci-demo-app:latest